<!-- Notion智能待办清单 - 纯前端版 -->
<div style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px;">
  <h3 style="color: #37352f;">📌 智能待办清单</h3>
  <input 
    type="text" 
    id="notionTaskInput" 
    placeholder="输入任务 + 回车" 
    style=" 
      padding: 8px 12px;
      width: 75%;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    "
  >
  <ul 
    id="notionTaskList" 
    style=" 
      list-style-type: none;
      padding-left: 0;
      margin-top: 16px;
    "
  ></ul>
</div>
 
<script>
  // 本地存储逻辑（仅当前页面有效）
  function saveTasks() {
    const tasks = [];
    document.querySelectorAll('#notionTaskList li').forEach(li => {
      tasks.push({
        text: li.querySelector('span').innerText,
        done: li.querySelector('input').checked
      });
    });
    localStorage.setItem('notionTasks', JSON.stringify(tasks));
  }
 
  // 加载保存的任务
  function loadTasks() {
    const saved = JSON.parse(localStorage.getItem('notionTasks')) || [];
    saved.forEach(task => {
      addTask(task.text, task.done);
    });
  }
 
  // 添加任务函数 
  function addTask(text, isDone = false) {
    const li = document.createElement('li');
    li.innerHTML = `
      <label style=" 
        display: flex;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
      ">
        <input 
          type="checkbox" 
          ${isDone ? 'checked' : ''}
          onchange=" 
            this.nextElementSibling.style.textDecoration = 
              this.checked ? 'line-through' : 'none';
            saveTasks();
          "
          style="margin-right: 8px;"
        >
        <span style=" 
          flex-grow: 1;
          color: #37352f;
          text-decoration: ${isDone ? 'line-through' : 'none'};
        ">${text}</span>
        <button 
          onclick="this.closest('li').remove(); saveTasks();" 
          style=" 
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 18px;
            cursor: pointer;
          "
        >×</button>
      </label>
    `;
    document.getElementById('notionTaskList').appendChild(li);
  }
 
  // 初始化
  document.getElementById('notionTaskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && e.target.value.trim()) {
      addTask(e.target.value.trim());
      saveTasks();
      e.target.value = '';
    }
  });
 
  // 页面加载时读取数据 
  window.addEventListener('load', loadTasks);
</script>
