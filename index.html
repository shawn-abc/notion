<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一句+日常待办 </title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background-color: #f0f8ff;
    background-image: linear-gradient(135deg, #f0f8ff 0%, #e6f0ff 100%);
    color: #333333;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 25px;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(173, 216, 230, 0.2);
    border: 1px solid #e0f0ff;
    position: relative;
}

.header h1 {
    color: #4682b4;
    font-size: 32px;
    margin-bottom: 10px;
    font-weight: 600;
    letter-spacing: -0.5px;
}

.date-section {
    background-color: #e0ffff;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 25px;
    border: 1px solid #b0e0e6;
    text-align: center;
}

.date-section h2 {
    color: #1e90ff;
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: 500;
}

.quote-section {
    background-color: #f8fcff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    border: 1px solid #d0e8ff;
}

.quote-section h3 {
    color: #4682b4;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    font-weight: 600;
}

.quote-text {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 18px;
    line-height: 1.6;
    color: #444;
    padding: 15px;
    background-color: white;
    border-radius: 8px;
    border-left: 4px solid #87ceeb;
    margin-bottom: 15px;
}

.todo-section {
    background-color: #f5fbff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    border: 1px solid #d0e8ff;
}

.todo-section h3 {
    color: #4682b4;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    font-weight: 600;
}

.todo-input {
    flex-grow: 1;
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid #87ceeb;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    background-color: white;
}

.add-btn {
    background-color: #4682b4;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    margin-left: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
}

.add-btn:hover {
    background-color: #1e90ff;
}

.todo-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    background-color: white;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid #d0e8ff;
    transition: all 0.2s;
}

.todo-item:hover {
    border-color: #4682b4;
}

.delete-btn {
    background-color: #e6f2ff;
    color: #4682b4;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    transition: all 0.2s;
}

.delete-btn:hover {
    background-color: #4682b4;
    color: white;
}

.notes-section {
    background-color: #f8fcff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    border: 1px solid #d0e8ff;
}

.notes-section h3 {
    color: #4682b4;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    font-weight: 600;
}

.notes-input {
    flex-grow: 1;
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid #87ceeb;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    background-color: white;
    min-height: 100px;
    resize: vertical;
}

.notes-item {
    padding: 12px 15px;
    background-color: white;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid #e0f0ff;
    font-size: 16px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}

.quote-list-section {
    background-color: #f5fbff;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #d0e8ff;
}

.quote-list-section h3 {
    color: #4682b4;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    font-weight: 600;
}

.quote-list-input {
    flex-grow: 1;
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid #87ceeb;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    background-color: white;
}

.quote-list-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    background-color: white;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid #e0f0ff;
}

.random-btn {
    background-color: #4682b4;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
    font-weight: 500;
    transition: all 0.2s;
}

.random-btn:hover {
    background-color: #1e90ff;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #4682b4;
    font-size: 16px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}


        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 28px;
            }

            .date-section h2 {
                font-size: 24px;
            }

            .quote-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 每日一句 + 日常待办 ✨</h1>
            <p>记录你的每一天</p>
        </div>

        <div class="date-section">
            <h2 id="current-date">2024年6月11日 星期二</h2>
        </div>

        <div class="quote-section">
            <h3><i class="fas fa-quote-left"></i> 每日一句</h3>
            <div class="quote-text" id="daily-quote">
                每一天都是新的开始，加油哦！
            </div>
            <div class="quote-source">
                <span>Tomorrow, and tomorrow, and tomorrow, Creeps in this petty pace from day to day...</span>
                <button class="random-btn" id="refresh-quote">刷新一句</button>
            </div>
        </div>

        <div class="todo-section">
            <h3><i class="fas fa-list-check"></i> 待办事项</h3>
            <div class="todo-input-container">
                <input type="text" class="todo-input" id="todo-input" placeholder="请输入待办事项...">
                <button class="add-btn" id="add-todo">添加</button>
            </div>
            <ul class="todo-list" id="todo-list">
                <!-- 待办事项将在这里动态添加 -->
            </ul>
        </div>


        <div class="quote-list-section">
            <h3><i class="fas fa-book"></i> 自定义句子库</h3>
            <p>在这里添加你喜欢的句子，每日一句会从中随机抽取</p>
            <div class="quote-list-input-container">
                <input type="text" class="quote-list-input" id="quote-input" placeholder="添加一句喜欢的句子...">
                <button class="add-btn" id="add-quote">添加</button>
            </div>
            <ul class="quote-list" id="quote-list">
                <!-- 自定义句子将在这里动态添加 -->
            </ul>
            <button class="random-btn" id="random-quote">随机抽取一句</button>
        </div>

        <div class="footer">
            <p>❤️ 每一天都值得记录 ❤️</p>
        </div>
    </div>

    <script>
        // 获取当前日期
        function getCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const weekday = weekdays[now.getDay()];

            return `${year}年${month}月${day}日 ${weekday}`;
        }

        // 设置初始日期
        document.getElementById('current-date').textContent = getCurrentDate();

        // 自定义句子数组（初始句子）
        let quoteList = [
            "我爱月夜，但我也爱星天。",
            "在标准的汉语里左右逢缘，驶驭它们行走在坦途之上",
            "遗忘和记忆都富有创造性",
            "言语不多又不少，既能引出谈论的话题，又不会影响对方侃侃而谈",
            "他自己没有勇气奋起而战，于是把争斗说成是庸俗的",
            "一切被意识到的生活一旦被意识到就已成为过去，意义一旦成为意义就已走向未来",
            "对意识的检查，在于半梦半醒和彻底清醒之间",
            "我是自己的陌路人",
            "悬而未决的谜案最容易刺激想象，而没有根据的想象容易引起恐惧"
        ];

        // 待办事项数组
        let todoList = [];



        // 初始化显示
        function initializeDisplay() {
            // 显示随机一句
            displayRandomQuote();

            // 显示初始待办事项
            renderTodoList();


            // 显示自定义句子库
            renderQuoteList();
        }

        // 随机显示一句
        function displayRandomQuote() {
            if (quoteList.length > 0) {
                const randomIndex = Math.floor(Math.random() * quoteList.length);
                document.getElementById('daily-quote').textContent = quoteList[randomIndex];
            } else {
                document.getElementById('daily-quote').textContent = "请先在句子库中添加句子";
            }
        }

        // 渲染待办事项列表
        function renderTodoList() {
            const todoListElement = document.getElementById('todo-list');
            todoListElement.innerHTML = '';

            todoList.forEach((todo, index) => {
                const todoItem = document.createElement('li');
                todoItem.className = 'todo-item';

                todoItem.innerHTML = `
                    <i class="fas fa-circle" style="color: #ff7eb9;"></i>
                    <span class="todo-text">${todo}</span>
                    <button class="delete-btn" data-index="${index}">删除</button>
                `;

                todoListElement.appendChild(todoItem);
            });

            // 添加删除事件
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    todoList.splice(index, 1);
                    renderTodoList();
                });
            });
        }



        // 渲染自定义句子库
        function renderQuoteList() {
            const quoteListElement = document.getElementById('quote-list');
            quoteListElement.innerHTML = '';

            quoteList.forEach((quote, index) => {
                const quoteItem = document.createElement('li');
                quoteItem.className = 'quote-list-item';

                quoteItem.innerHTML = `
                    <i class="fas fa-star" style="color: #ff7eb9;"></i>
                    <span class="quote-list-text">${quote}</span>
                    <button class="delete-btn" data-quote-index="${index}">删除</button>
                `;

                quoteListElement.appendChild(quoteItem);
            });

            // 添加删除事件
            document.querySelectorAll('[data-quote-index]').forEach(button => {
                button.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-quote-index'));
                    quoteList.splice(index, 1);
                    renderQuoteList();
                    displayRandomQuote();
                });
            });
        }

        // 添加待办事项
        document.getElementById('add-todo').addEventListener('click', function() {
            const todoInput = document.getElementById('todo-input');
            const todoText = todoInput.value.trim();

            if (todoText) {
                todoList.push(todoText);
                todoInput.value = '';
                renderTodoList();
            } else {
                alert('请输入待办事项内容');
            }
        });


        // 添加自定义句子
        document.getElementById('add-quote').addEventListener('click', function() {
            const quoteInput = document.getElementById('quote-input');
            const quoteText = quoteInput.value.trim();

            if (quoteText) {
                quoteList.push(quoteText);
                quoteInput.value = '';
                renderQuoteList();
                displayRandomQuote();
            } else {
                alert('请输入句子内容');
            }
        });

        // 刷新每日一句
        document.getElementById('refresh-quote').addEventListener('click', function() {
            displayRandomQuote();
        });

        // 随机抽取一句
        document.getElementById('random-quote').addEventListener('click', function() {
            displayRandomQuote();
        });

        // 初始化页面
        initializeDisplay();

        // 添加键盘快捷键支持
        document.getElementById('todo-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('add-todo').click();
            }
        });

        document.getElementById('quote-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('add-quote').click();
            }
        });
    </script>
</body>
</html>
